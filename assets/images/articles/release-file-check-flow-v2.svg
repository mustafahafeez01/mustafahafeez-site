<svg xmlns="http://www.w3.org/2000/svg" width="600" height="890" viewBox="0 0 600 890" role="img" aria-labelledby="title desc"><title id="title">Every file has to belong</title><desc id="desc">Inventory the output. An unexpected notes file stops publication. Repair, rebuild and repeat the check. File contents require separate review.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#765339" flood-opacity=".055"/></filter></defs><rect width="600" height="890" rx="22" fill="#f8f5ef"/><text x="40" y="48" fill="#765339" font-family="Arial,sans-serif" font-size="15" font-weight="600">A RELEASE CHECK</text><text x="40" y="99" fill="#302a25" font-family="Georgia,serif" font-size="34" font-weight="400">Every file has to belong.</text><text x="40" y="138" fill="#6b6056" font-family="Arial,sans-serif" font-size="22" font-weight="400">A simplified rejection example</text><path d="M52 195V735" stroke="#d8caba" stroke-width="2"/><circle cx="52" cy="202" r="17" fill="#f8f5ef" stroke="#b5a18c"/><text x="47" y="208" fill="#765339" font-family="Arial,sans-serif" font-size="18" font-weight="400">1</text><circle cx="52" cy="487" r="17" fill="#f8f5ef" stroke="#b5a18c"/><text x="47" y="493" fill="#765339" font-family="Arial,sans-serif" font-size="18" font-weight="400">2</text><circle cx="52" cy="738" r="17" fill="#f8f5ef" stroke="#b5a18c"/><text x="47" y="744" fill="#765339" font-family="Arial,sans-serif" font-size="18" font-weight="400">3</text><text x="86" y="210" fill="#302a25" font-family="Georgia,serif" font-size="27" font-weight="400">Inspect the output</text><rect x="86" y="234" width="474" height="199" rx="16" fill="#fffdf8" stroke="#dfd5c8" filter="url(#shadow)"/><circle cx="117" cy="270" r="12" fill="#e8eddf"/><path d="m112 270 4 4 7-8" fill="none" stroke="#5b6c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="277" fill="#302a25" font-family="monospace" font-size="23" font-weight="400">index.html</text><circle cx="117" cy="320" r="12" fill="#e8eddf"/><path d="m112 320 4 4 7-8" fill="none" stroke="#5b6c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="327" fill="#302a25" font-family="monospace" font-size="23" font-weight="400">assets/site.css</text><rect x="101" y="348" width="444" height="66" rx="10" fill="#f6ebdb"/><text x="112" y="388" fill="#8a5d2f" font-family="Arial,sans-serif" font-size="27" font-weight="400">+</text><text x="142" y="389" fill="#302a25" font-family="monospace" font-size="22" font-weight="400">editorial-notes.txt</text><text x="86" y="495" fill="#302a25" font-family="Georgia,serif" font-size="26" font-weight="400">Compare with the approved list</text><rect x="86" y="520" width="474" height="143" rx="16" fill="#fffdf8" stroke="#dfd5c8" filter="url(#shadow)"/><text x="110" y="559" fill="#302a25" font-family="Arial,sans-serif" font-size="23" font-weight="400">The notes file is unexpected.</text><text x="110" y="602" fill="#765339" font-family="Arial,sans-serif" font-size="25" font-weight="600">Stop publication</text><text x="110" y="635" fill="#6b6056" font-family="Arial,sans-serif" font-size="20" font-weight="400">Inspect how it entered the build.</text><text x="86" y="746" fill="#302a25" font-family="Georgia,serif" font-size="25" font-weight="400">Repair, rebuild and check again</text><text x="86" y="785" fill="#6b6056" font-family="Arial,sans-serif" font-size="21" font-weight="400">A match proceeds to the other checks.</text><text x="40" y="849" fill="#6b6056" font-family="Arial,sans-serif" font-size="21" font-weight="400">A file list checks paths. Review file contents too.</text></svg>