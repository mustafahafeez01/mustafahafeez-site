<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
<title id="title">Choose an input that exposes the difference</title><desc id="desc">A fictional example. With only past trips, both calculations return the same total. Adding a future trip separates days already used from days planned.</desc>
<rect width="1000" height="740" rx="20" fill="#eee7dd"/>
<g fill="#302a25" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<text x="500" y="78" font-size="34" font-family="Georgia, serif">What does “used so far” count?</text>
<text x="500" y="118" font-size="22" fill="#6b6056">Fictional example of a test input</text>
<rect x="65" y="160" width="870" height="205" rx="12" fill="#f8f5ef"/>
<text x="500" y="210" font-size="28">Input: past trips only</text>
<text x="500" y="261" font-size="24">Past days and all planned days</text>
<text x="500" y="300" font-size="24">produce the same total.</text>
<text x="500" y="340" font-size="22" fill="#6b6056">The input cannot expose the mistake.</text>
<path d="M500 385v40m-12-12 12 12 12-12" stroke="#765339" stroke-width="4" fill="none"/>
<rect x="65" y="450" width="870" height="205" rx="12" fill="#f8f5ef" stroke="#765339" stroke-width="2"/>
<text x="500" y="500" font-size="28">Input: add a future trip</text>
<text x="500" y="551" font-size="24">Days already used should stay unchanged.</text>
<text x="500" y="590" font-size="24">A total including future days would increase.</text>
<text x="500" y="630" font-size="22" fill="#6b6056">The two interpretations now produce different results.</text>
<text x="500" y="706" font-size="20" fill="#6b6056">A proposed check, not a recorded test result.</text>
</g></svg>
