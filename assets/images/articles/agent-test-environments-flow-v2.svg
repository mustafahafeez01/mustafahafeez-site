<svg xmlns="http://www.w3.org/2000/svg" width="600" height="910" viewBox="0 0 600 910" role="img" aria-labelledby="title desc"><title id="title">Two kinds of evidence</title><desc id="desc">Sandbox fixtures check decisions from known process lists. Host tests check real process observation. Review both sets of evidence.</desc><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#765339" flood-opacity=".055"/></filter></defs><rect width="600" height="910" rx="22" fill="#f8f5ef"/><text x="40" y="48" fill="#765339" font-family="Arial,sans-serif" font-size="15" font-weight="600">TESTING AN AGENT’S CHANGES</text><text x="40" y="99" fill="#302a25" font-family="Georgia,serif" font-size="34" font-weight="400">Two kinds of evidence.</text><text x="40" y="138" fill="#6b6056" font-family="Arial,sans-serif" font-size="23" font-weight="400">Each test needs a clear job.</text><rect x="40" y="175" width="520" height="234" rx="16" fill="#fffdf8" stroke="#dfd5c8" filter="url(#shadow)"/><rect x="66" y="202" width="50" height="40" rx="7" fill="#eee7dd"/><path d="m78 213 8 8-8 8m18 0h10" fill="none" stroke="#765339" stroke-width="2.5" stroke-linecap="round"/><text x="133" y="229" fill="#302a25" font-family="Georgia,serif" font-size="27" font-weight="400">Inside the sandbox</text><text x="66" y="278" fill="#302a25" font-family="Arial,sans-serif" font-size="24" font-weight="400">Supply a known process list.</text><text x="66" y="318" fill="#302a25" font-family="Arial,sans-serif" font-size="24" font-weight="400">Check the decision it produces.</text><line x1="66" y1="341" x2="534" y2="341" stroke="#e7dfd5"/><circle cx="78" cy="372" r="12" fill="#e8eddf"/><path d="m73 372 4 4 7-8" fill="none" stroke="#5b6c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="380" fill="#5b6c49" font-family="Arial,sans-serif" font-size="21" font-weight="400">Process present / process absent</text><rect x="40" y="435" width="520" height="234" rx="16" fill="#fffdf8" stroke="#dfd5c8" filter="url(#shadow)"/><rect x="66" y="462" width="50" height="40" rx="7" fill="#e8eddf"/><g stroke="#5b6c49" stroke-width="2" fill="none"><rect x="78" y="471" width="26" height="17" rx="2"/><path d="M91 488v6m-9 0h18"/></g><text x="133" y="489" fill="#302a25" font-family="Georgia,serif" font-size="27" font-weight="400">On the real machine</text><text x="66" y="538" fill="#302a25" font-family="Arial,sans-serif" font-size="24" font-weight="400">Start a controlled process.</text><text x="66" y="578" fill="#302a25" font-family="Arial,sans-serif" font-size="24" font-weight="400">Check that the real tool finds it.</text><line x1="66" y1="601" x2="534" y2="601" stroke="#e7dfd5"/><circle cx="78" cy="632" r="12" fill="#e8eddf"/><path d="m73 632 4 4 7-8" fill="none" stroke="#5b6c49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="640" fill="#5b6c49" font-family="Arial,sans-serif" font-size="21" font-weight="400">Observe the system interaction</text><path d="M300 669v43" stroke="#b5a18c" stroke-width="2"/><circle cx="300" cy="719" r="4" fill="#765339"/><text x="102" y="770" fill="#302a25" font-family="Georgia,serif" font-size="30" font-weight="400">Bring both results to review.</text><text x="86" y="812" fill="#6b6056" font-family="Arial,sans-serif" font-size="21" font-weight="400">Name the test set, environment and revision.</text><text x="40" y="871" fill="#6b6056" font-family="Arial,sans-serif" font-size="20" font-weight="400">Fixtures explain decisions. Host checks observe reality.</text></svg>